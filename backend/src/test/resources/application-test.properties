spring.datasource.url=jdbc:h2:mem:reservas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# En pruebas, HU19 se invoca manualmente desde el test: se desactiva el disparo automático
# dejando un intervalo muy largo, para que no compita con las aserciones.
app.recordatorios.intervalo-ms=3600000
app.recordatorios.ventana-horas=24
