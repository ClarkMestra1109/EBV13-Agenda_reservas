spring.application.name=reservas
server.port=${PORT:8080}

# Base de datos (PostgreSQL). En Render/Supabase/Neon se definen como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Sprint 1: Hibernate crea/actualiza las tablas. Más adelante conviene pasar a Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-en-produccion-1234567890}
app.jwt.expiration-minutes=120

# CORS: URL(s) del frontend separadas por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# URL pública del frontend, usada para construir el enlace de recuperación de contraseña (HU04)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# HU19: ventana de anticipación del recordatorio y cada cuánto se revisan reservas pendientes
app.recordatorios.ventana-horas=${RECORDATORIOS_VENTANA_HORAS:24}
app.recordatorios.intervalo-ms=${RECORDATORIOS_INTERVALO_MS:300000}

# Evita la contraseña generada por defecto de Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
